<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Facturas e Impresión PDF</title>
  <!-- Librería html2pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    /* Estilos Generales */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    h2 { font-size: 20px; margin-bottom: 20px; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    
    /* Pestañas */
    .tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid #cbd5e1; }
    .tab-btn { padding: 12px 20px; border: none; background: none; font-size: 15px; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
    .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Tablas */
    table.data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    table.data-table th, table.data-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    table.data-table th { background-color: #f8fafc; font-weight: 600; color: #475569; }
    
    /* Botones */
    .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background-color: #2563eb; color: white; }
    .btn-primary:hover { background-color: #1d4ed8; }

    /* Explorador Layout Dual */
    .explorer-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
    @media (max-width: 900px) { .explorer-grid { grid-template-columns: 1fr; } }
    
    .invoice-list-item { padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 10px; cursor: pointer; transition: background 0.2s; }
    .invoice-list-item:hover, .invoice-list-item.selected { background-color: #eff6ff; border-color: #bfdbfe; }
    .invoice-list-item .inv-num { font-weight: bold; color: #1e293b; }
    .invoice-list-item .inv-client { font-size: 13px; color: #64748b; }
    .invoice-list-item .inv-total { font-weight: 600; color: #059669; font-size: 14px; margin-top: 4px; }

    /* Visor PDF */
    .factura-preview-iframe { width: 100%; height: 750px; border: 1px solid #cbd5e1; border-radius: 8px; background-color: #525659; }

    /* MOTOR DE RENDERIZADO OFF-SCREEN (Resuelve el fallo de página en blanco) */
    #factura-render-engine {
      position: fixed;
      top: 0;
      left: -9999px;
      width: 794px; /* Ancho estándar A4 @ 96DPI */
      min-height: 1123px;
      background-color: #ffffff !important;
      color: #000000 !important;
      z-index: -9999;
      visibility: visible !important;
      display: block !important;
      box-sizing: border-box;
      padding: 40px;
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navegación de Módulos -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('historial')">Historial de Pagos</button>
      <button class="tab-btn" onclick="switchTab('explorador')">Explorador de Facturas</button>
    </div>

    <!-- MÓDULO 1: HISTORIAL DE PAGOS -->
    <div id="tab-historial" class="tab-content active">
      <h2>Historial de Pagos Registrados</h2>
      <table class="data-table">
        <thead>
          <tr>
            <th>Nº Factura</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Total</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tabla-historial-body">
          <!-- Datos dinámicos -->
        </tbody>
      </table>
    </div>

    <!-- MÓDULO 2: EXPLORADOR DE FACTURAS -->
    <div id="tab-explorador" class="tab-content">
      <h2>Explorador e Impresión Visual de Facturas</h2>
      <div class="explorer-grid">
        <!-- Lista de Selección -->
        <div>
          <p style="margin-bottom: 10px; font-weight: 600; color: #64748b; font-size: 13px;">SELECCIONE UNA FACTURA:</p>
          <div id="lista-facturas-explorador">
            <!-- Datos dinámicos -->
          </div>
        </div>

        <!-- Visor PDF Renderizado -->
        <div>
          <iframe id="visor-pdf-factura" class="factura-preview-iframe" title="Vista Previa de Factura PDF"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTENEDOR OCULTO PERO ACTIVO EN EL DOM PARA EL RENDERIZADO -->
  <div id="factura-render-engine"></div>

  <script>
    // Datos de Facturas
    const FACTURAS_DATA = [
      {
        numeroFactura: "FAC-2026-001",
        fecha: "2026-08-15",
        emisorNombre: "Mi Empresa S.L.",
        emisorNif: "B12345678",
        emisorDireccion: "Calle Principal 123, Alicante",
        emisorTelefono: "965000000 - info@miempresa.com",
        clienteNombre: "Carlos Cortés",
        clienteNif: "12345678X",
        clienteDireccion: "Av. Constitución 45, Pinoso",
        lineas: [
          { concepto: "Servicio de Consultoría Técnica", cantidad: 1, precioUnitario: 350.00, totalLinea: 350.00 },
          { concepto: "Desarrollo y Ajuste de Módulo PDF", cantidad: 2, precioUnitario: 120.00, totalLinea: 240.00 }
        ],
        baseImponible: 590.00,
        porcentajeIva: 21,
        importeIva: 123.90,
        porcentajeIrpf: 0,
        importeIrpf: 0,
        totalFactura: 713.90
      },
      {
        numeroFactura: "FAC-2026-002",
        fecha: "2026-09-01",
        emisorNombre: "Mi Empresa S.L.",
        emisorNif: "B12345678",
        emisorDireccion: "Calle Principal 123, Alicante",
        emisorTelefono: "965000000 - info@miempresa.com",
        clienteNombre: "Soporte Técnico SL",
        clienteNif: "B98765432",
        clienteDireccion: "Calle Mayor 12, Torrevieja",
        lineas: [
          { concepto: "Mantenimiento Sistema Web", cantidad: 1, precioUnitario: 150.00, totalLinea: 150.00 }
        ],
        baseImponible: 150.00,
        porcentajeIva: 21,
        importeIva: 31.50,
        porcentajeIrpf: 15,
        importeIrpf: 22.50,
        totalFactura: 159.00
      }
    ];

    // Cambiar de pestañas
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      if(tabName === 'historial') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-historial').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-explorador').classList.add('active');
        if(FACTURAS_DATA.length > 0) {
          seleccionarFacturaExplorador(0);
        }
      }
    }

    // Plantilla Oficial Única e Intacta
    function obtenerPlantillaFacturaOficial(data) {
      const lineasHTML = (data.lineas || []).map(item => `
        <tr>
          <td style="padding: 10px; border-bottom: 1px solid #eee; text-align: left;">${item.concepto}</td>
          <td style="padding: 10px; border-bottom: 1px solid #eee; text-align: center;">${item.cantidad}</td>
          <td style="padding: 10px; border-bottom: 1px solid #eee; text-align: right;">${item.precioUnitario.toFixed(2)} €</td>
          <td style="padding: 10px; border-bottom: 1px solid #eee; text-align: right;">${item.totalLinea.toFixed(2)} €</td>
        </tr>
      `).join('');

      return `
        <div style="width: 100%; color: #333; font-size: 13px; line-height: 1.5;">
          <!-- Cabecera -->
          <table style="width: 100%; margin-bottom: 30px; border-collapse: collapse;">
            <tr>
              <td style="vertical-align: top; width: 50%;">
                <h1 style="margin: 0 0 5px 0; color: #1a202c; font-size: 24px;">FACTURA</h1>
                <p style="margin: 0; color: #718096; font-size: 12px;">Nº Factura: <strong>${data.numeroFactura || '---'}</strong></p>
                <p style="margin: 0; color: #718096; font-size: 12px;">Fecha: <strong>${data.fecha || '---'}</strong></p>
              </td>
              <td style="vertical-align: top; width: 50%; text-align: right;">
                <strong style="font-size: 16px; color: #2d3748;">${data.emisorNombre}</strong><br>
                <span>NIF/CIF: ${data.emisorNif}</span><br>
                <span>${data.emisorDireccion}</span><br>
                <span>${data.emisorTelefono}</span>
              </td>
            </tr>
          </table>

          <!-- Datos del Cliente -->
          <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 15px; margin-bottom: 30px;">
            <strong style="color: #4a5568; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">Cliente / Receptor</strong>
            <div style="margin-top: 5px; font-size: 14px;">
              <strong>${data.clienteNombre}</strong><br>
              NIF/CIF: ${data.clienteNif}<br>
              ${data.clienteDireccion}
            </div>
          </div>

          <!-- Tabla de Conceptos -->
          <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;">
            <thead>
              <tr style="background-color: #edf2f7; color: #2d3748; font-size: 12px; font-weight: bold;">
                <th style="padding: 10px; text-align: left; border-bottom: 2px solid #cbd5e0;">Concepto / Descripción</th>
                <th style="padding: 10px; text-align: center; border-bottom: 2px solid #cbd5e0; width: 80px;">Cant.</th>
                <th style="padding: 10px; text-align: right; border-bottom: 2px solid #cbd5e0; width: 110px;">Precio Ud.</th>
                <th style="padding: 10px; text-align: right; border-bottom: 2px solid #cbd5e0; width: 110px;">Total</th>
              </tr>
            </thead>
            <tbody>
              ${lineasHTML}
            </tbody>
          </table>

          <!-- Totales -->
          <table style="width: 100%; border-collapse: collapse;">
            <tr>
              <td style="width: 50%;"></td>
              <td style="width: 50%;">
                <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                  <tr>
                    <td style="padding: 6px 10px; text-align: right;">Base Imponible:</td>
                    <td style="padding: 6px 10px; text-align: right; width: 120px;">${data.baseImponible.toFixed(2)} €</td>
                  </tr>
                  <tr>
                    <td style="padding: 6px 10px; text-align: right;">IVA (${data.porcentajeIva}%):</td>
                    <td style="padding: 6px 10px; text-align: right;">${data.importeIva.toFixed(2)} €</td>
                  </tr>
                  ${data.importeIrpf ? `
                  <tr>
                    <td style="padding: 6px 10px; text-align: right; color: #c53030;">Retención IRPF (${data.porcentajeIrpf}%):</td>
                    <td style="padding: 6px 10px; text-align: right; color: #c53030;">-${data.importeIrpf.toFixed(2)} €</td>
                  </tr>
                  ` : ''}
                  <tr style="font-size: 16px; font-weight: bold; border-top: 2px solid #2d3748;">
                    <td style="padding: 12px 10px; text-align: right; color: #1a202c;">TOTAL FACTURA:</td>
                    <td style="padding: 12px 10px; text-align: right; color: #1a202c;">${data.totalFactura.toFixed(2)} €</td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </div>
      `;
    }

    // Motor de Procesamiento PDF (Descarga y Visualización en Iframe)
    async function procesarFacturaPDF(datosFactura, destino = 'DESCARGAR', iframeId = null) {
      const renderEngine = document.getElementById('factura-render-engine');
      
      // Inyectar HTML
      renderEngine.innerHTML = obtenerPlantillaFacturaOficial(datosFactura);

      // Tiempo de retardo necesario para que el navegador procese el render en el DOM
      await new Promise(resolve => setTimeout(resolve, 250));

      const opt = {
        margin: [10, 10, 10, 10],
        filename: `Factura_${datosFactura.numeroFactura}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: {
          scale: 2,
          useCORS: true,
          logging: false,
          scrollX: 0,
          scrollY: 0,
          windowWidth: 794
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      try {
        if (destino === 'DESCARGAR') {
          await html2pdf().set(opt).from(renderEngine).save();
        } else if (destino === 'VISUALIZAR') {
          const pdfBlob = await html2pdf().set(opt).from(renderEngine).output('blob');
          const blobUrl = URL.createObjectURL(pdfBlob);

          if (iframeId) {
            const iframe = document.getElementById(iframeId);
            if (iframe) {
              iframe.src = blobUrl;
            }
          }
        }
      } catch (err) {
        console.error("Error procesando PDF:", err);
      } finally {
        renderEngine.innerHTML = '';
      }
    }

    // Lógica Historial de Pagos
    function cargarHistorialPagos() {
      const tbody = document.getElementById('tabla-historial-body');
      tbody.innerHTML = FACTURAS_DATA.map((fac, idx) => `
        <tr>
          <td><strong>${fac.numeroFactura}</strong></td>
          <td>${fac.fecha}</td>
          <td>${fac.clienteNombre}</td>
          <td><strong>${fac.totalFactura.toFixed(2)} €</strong></td>
          <td>
            <button class="btn btn-primary" onclick="descargarFacturaHistorial(${idx})">
              Descargar PDF
            </button>
          </td>
        </tr>
      `).join('');
    }

    function descargarFacturaHistorial(index) {
      procesarFacturaPDF(FACTURAS_DATA[index], 'DESCARGAR');
    }

    // Lógica Explorador de Facturas
    function cargarExploradorFacturas() {
      const container = document.getElementById('lista-facturas-explorador');
      container.innerHTML = FACTURAS_DATA.map((fac, idx) => `
        <div class="invoice-list-item" id="exp-item-${idx}" onclick="seleccionarFacturaExplorador(${idx})">
          <div class="inv-num">${fac.numeroFactura}</div>
          <div class="inv-client">${fac.clienteNombre} - ${fac.fecha}</div>
          <div class="inv-total">${fac.totalFactura.toFixed(2)} €</div>
        </div>
      `).join('');
    }

    function seleccionarFacturaExplorador(index) {
      document.querySelectorAll('.invoice-list-item').forEach(item => item.classList.remove('selected'));
      const selectedElem = document.getElementById(`exp-item-${index}`);
      if(selectedElem) selectedElem.classList.add('selected');

      procesarFacturaPDF(FACTURAS_DATA[index], 'VISUALIZAR', 'visor-pdf-factura');
    }

    // Inicialización al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      cargarHistorialPagos();
      cargarExploradorFacturas();
    });
  </script>

</body>
</html>
